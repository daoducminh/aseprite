name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Git tag to build (e.g. v1.3.17.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Verify tag exists
        run: git fetch --tags --depth 1 origin "refs/tags/${{ env.VERSION }}:refs/tags/${{ env.VERSION }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Aseprite (${{ env.VERSION }})
        run: ./docker/build.sh "${{ env.VERSION }}"

      - name: Verify build output
        run: |
          test -x output/aseprite
          ./output/aseprite --version

      - name: Package release artifact
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          ARTIFACT="aseprite-${VERSION}-linux-x64"
          mkdir -p "$ARTIFACT"
          cp -a output "$ARTIFACT/output"
          cp docker/install.sh "$ARTIFACT/install.sh"
          chmod +x "$ARTIFACT/install.sh"
          zip -r "${ARTIFACT}.zip" "$ARTIFACT"
          echo "artifact=${ARTIFACT}.zip" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Aseprite ${{ env.VERSION }} (self-built)
          files: ${{ steps.package.outputs.artifact }}
